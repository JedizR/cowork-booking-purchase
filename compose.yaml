name: cowork-booking-purchase
services:
  db:
    image: postgres:16
    container_name: cowork-booking-purchase-db
    environment:
      POSTGRES_USER: cowork
      POSTGRES_PASSWORD: cowork
      POSTGRES_DB: cowork_purchase
    ports:
      - "5441:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  app:
    build: .
    image: cowork-booking-purchase
    container_name: cowork-booking-purchase-app
    environment:
      APP_REVISION: compose
      DATABASE_URL: postgresql://cowork:cowork@db:5432/cowork_purchase
    ports:
      - "8001:8000"
    depends_on:
      - db

volumes:
  db-data:
