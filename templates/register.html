{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
  <h1>Sign up</h1>
  <form method="post" action="/register">
    <input type="email" name="email" placeholder="Email" required>
    <input name="display_name" placeholder="Display name" required maxlength="50">
    <input type="password" name="password" placeholder="Password (8+ characters)" required minlength="8">
    <button type="submit">Sign up</button>
  </form>
  <p class="hint">Already have an account? <a href="/login">Log in</a></p>
{% endblock %}
