<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cowork Booking — {% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <nav class="site-nav">
      <a class="brand" href="/">Cowork Booking</a>
      <a href="/dashboard">Business metrics</a>
      <span class="spacer"></span>
      {% if current_user_email %}
        Logged in as {{ current_user_email }} ·
        <a href="/bookings/mine">My bookings</a>
        <form method="post" action="/logout"><button type="submit">Log out</button></form>
      {% else %}
        <a href="/register">Register</a> · <a href="/login">Log in</a>
      {% endif %}
    </nav>
    {% block content %}{% endblock %}
  </body>
</html>
